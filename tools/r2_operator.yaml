identity:
  name: r2_operator
  author: r3-yamauchi
  label:
    en_US: Cloudflare R2 Operator
    zh_Hans: Cloudflare R2 读写器
    pt_BR: Cloudflare R2 Operator
    ja_JP: Cloudflare R2 オペレーター
description:
  human:
    en_US: Cloudflare R2 Writer and Reader
    zh_Hans: 读写R2 bucket中的文件
    pt_BR: Cloudflare R2 Writer and Reader
    ja_JP: Cloudflare R2 バケットへの読み書きを行うツールです
  llm: Cloudflare R2 Writer and Reader
parameters:
  - name: account_id
    type: string
    required: false
    label:
      en_US: Cloudflare Account ID
      ja_JP: Cloudflare アカウント ID
    human_description:
      en_US: Override the provider Account ID for this tool if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きする Account ID。
    form: form

  - name: access_key_id
    type: string
    required: false
    label:
      en_US: R2 Access Key ID
      ja_JP: R2 アクセスキー ID
    human_description:
      en_US: Override the provider Access Key ID for this tool if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きする Access Key ID。
    form: form

  - name: secret_access_key
    type: string
    required: false
    label:
      en_US: R2 Secret Access Key
      ja_JP: R2 シークレットアクセスキー
    human_description:
      en_US: Override the provider Secret Access Key for this tool if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きするシークレットキー。
    form: form

  - name: region_name
    type: string
    required: false
    label:
      en_US: R2 Region Name
      ja_JP: R2 リージョン名
    human_description:
      en_US: Override the default R2 Region Name for this tool.
      ja_JP: このツール固有の R2 リージョン名を指定します。
    form: form

  - name: text_content
    type: string
    required: false
    label:
      en_US: The text to write
      zh_Hans: 待写入的文本
      pt_BR: The text to write
      ja_JP: 書き込むテキスト
    human_description:
      en_US: The text to write
      zh_Hans: 待写入的文本
      pt_BR: The text to write
      ja_JP: R2 に保存するテキスト本文
    llm_description: The text to write
    form: llm
  - name: r2_uri
    type: string
    required: true
    label:
      en_US: r2 uri
      zh_Hans: r2 uri
      pt_BR: r2 uri
      ja_JP: R2 URI
    human_description:
      en_US: "r2 uri (s3:// format is also accepted for compatibility)"
      zh_Hans: r2 uri
      pt_BR: r2 uri
      ja_JP: 操作対象の `r2://bucket/key` 形式の URI（互換性のため `s3://` 形式も受け付けます）
    llm_description: r2 uri (r2:// or s3:// format)
    form: llm
  - name: operation_type
    type: select
    required: true
    label:
      en_US: operation type
      zh_Hans: 操作类型
      pt_BR: operation type
      ja_JP: 操作種別
    human_description:
      en_US: operation type
      zh_Hans: 操作类型
      pt_BR: operation type
      ja_JP: 読み込みか書き込みかを選択します
    default: read
    options:
      - value: read
        label:
          en_US: read
          zh_Hans: 读
          ja_JP: 読み込み
      - value: write
        label:
          en_US: write
          zh_Hans: 写
          ja_JP: 書き込み
    form: form
  - name: generate_presign_url
    type: boolean
    required: false
    label:
      en_US: Generate presigned URL
      zh_Hans: 生成预签名URL
      ja_JP: 署名付き URL を生成
    human_description:
      en_US: Whether to generate a presigned URL for the R2 object
      zh_Hans: 是否生成R2对象的预签名URL
      ja_JP: R2 オブジェクトの署名付き URL を生成するか
    default: false
    form: form
  - name: presign_expiry
    type: number
    required: false
    label:
      en_US: Presigned URL expiration time
      zh_Hans: 预签名URL有效期
      ja_JP: 署名付き URL の有効期限
    human_description:
      en_US: Expiration time in seconds for the presigned URL
      zh_Hans: 预签名URL的有效期（秒）
      ja_JP: 署名付き URL の有効期限（秒）
    default: 3600
    form: form
extra:
  python:
    source: tools/r2_operator.py



