identity:
  name: r2_object_metadata
  author: r3-yamauchi
  label:
    en_US: Cloudflare R2 Object Metadata
    zh_Hans: Cloudflare R2 对象元数据
    pt_BR: Cloudflare R2 Object Metadata
    ja_JP: Cloudflare R2 オブジェクトメタデータ
description:
  human:
    en_US: Get or update metadata for a Cloudflare R2 object.
    zh_Hans: 获取或更新 Cloudflare R2 对象的元数据。
    pt_BR: Obtenha ou atualize metadados de um objeto Cloudflare R2.
    ja_JP: Cloudflare R2 オブジェクトのメタデータを取得または更新します。
  llm: Get or update metadata (custom metadata, content type) for a Cloudflare R2 object.
parameters:
  - name: account_id
    type: string
    required: false
    label:
      en_US: Cloudflare Account ID
      ja_JP: Cloudflare アカウント ID
    human_description:
      en_US: Override the provider Account ID for this tool if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きする Account ID。
    form: form

  - name: access_key_id
    type: string
    required: false
    label:
      en_US: R2 Access Key ID
      ja_JP: R2 アクセスキー ID
    human_description:
      en_US: Override the provider Access Key ID for this tool if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きする Access Key ID。
    form: form

  - name: secret_access_key
    type: string
    required: false
    label:
      en_US: R2 Secret Access Key
      ja_JP: R2 シークレットアクセスキー
    human_description:
      en_US: Override the provider Secret Access Key for this tool if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きするシークレットキー。
    form: form

  - name: region_name
    type: string
    required: false
    label:
      en_US: R2 Region Name
      ja_JP: R2 リージョン名
    human_description:
      en_US: Override the default R2 Region Name for this tool.
      ja_JP: このツール固有の R2 リージョン名を指定します。
    form: form

  - name: r2_uri
    type: string
    required: true
    label:
      en_US: R2 URI
      ja_JP: R2 URI
    human_description:
      en_US: "Target object in r2://bucket/key format (s3:// format is also accepted for compatibility)."
      ja_JP: "対象オブジェクトを `r2://bucket/key` 形式で指定します（互換性のため `s3://` 形式も受け付けます）。"
    llm_description: R2 URI of the object (r2:// or s3:// format).
    form: llm

  - name: operation
    type: select
    required: true
    label:
      en_US: Operation
      ja_JP: 操作
    human_description:
      en_US: Get or update metadata.
      ja_JP: メタデータを取得するか更新するかを選択します。
    default: get
    options:
      - value: get
        label:
          en_US: Get metadata
          ja_JP: メタデータを取得
      - value: update
        label:
          en_US: Update metadata
          ja_JP: メタデータを更新
    form: form

  - name: metadata
    type: string
    required: false
    label:
      en_US: Metadata
      ja_JP: メタデータ
    human_description:
      en_US: "Metadata to update (format: \"key1=value1,key2=value2\" or JSON string). Required for update operation."
      ja_JP: "更新するメタデータ（形式: \"key1=value1,key2=value2\" または JSON文字列）。更新操作時は必須です。"
    llm_description: Metadata to update in key=value format or JSON.
    form: llm

  - name: content_type
    type: string
    required: false
    label:
      en_US: Content Type
      ja_JP: コンテンツタイプ
    human_description:
      en_US: "Content type to update (e.g., \"text/plain\", \"image/png\"). Optional for update operation."
      ja_JP: "更新するコンテンツタイプ（例: \"text/plain\", \"image/png\"）。更新操作時は任意です。"
    form: form

extra:
  python:
    source: tools/r2_object_metadata.py

