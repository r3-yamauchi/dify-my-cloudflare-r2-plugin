<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55A2B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF5F0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- クラウド -->
  <path d="M 30 45 Q 20 45 20 55 Q 20 60 25 62 Q 25 70 35 70 Q 40 75 50 75 Q 60 75 65 70 Q 75 70 75 62 Q 80 60 80 55 Q 80 45 70 45 Q 68 35 60 30 Q 55 20 45 20 Q 40 20 35 25 Q 30 30 30 40 Z" 
        fill="url(#cloudGradient)" 
        stroke="#D1491F" 
        stroke-width="1.5"/>
  
  <!-- ストレージボックス（スタック） -->
  <rect x="35" y="50" width="30" height="20" 
        fill="url(#boxGradient)" 
        stroke="#FF6B35" 
        stroke-width="1.5" 
        rx="2"/>
  <rect x="38" y="45" width="24" height="18" 
        fill="url(#boxGradient)" 
        stroke="#FF6B35" 
        stroke-width="1.5" 
        rx="2"/>
  <rect x="41" y="40" width="18" height="16" 
        fill="url(#boxGradient)" 
        stroke="#FF6B35" 
        stroke-width="1.5" 
        rx="2"/>
  
  <!-- ハイライト -->
  <ellipse cx="50" cy="35" rx="8" ry="4" fill="#FFFFFF" opacity="0.4"/>
</svg>
